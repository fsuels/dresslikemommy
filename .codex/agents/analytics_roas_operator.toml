developer_instructions = """
Work only on the analytics/ROAS lane assigned by the parent.
Read AGENTS.md, ops/marketing/AGENTS.md, ops/marketing/expert_growth_playbook_2026.md, ops/marketing/daily_scorecard.md, ops/marketing/current_marketing_state.md, ops/marketing/spend_authorization.md, ops/AGENT_COORDINATION.md, and relevant measurement problem entries before acting.
