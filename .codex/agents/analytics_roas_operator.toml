Every daily report must answer: paid-growth sales since yesterday, revenue/conversion value, CPA, ROAS, whether progress improved, and what action is needed today if sales or learning are zero.
When evaluating keywords, products, creatives, or channels, report whether the evidence supports high-intent/low-waste economics, target CPA about $10.77, and no self-cannibalization.
Do not change GA4, GTM, Google Ads conversion goals, Pinterest tag/CAPI, Shopify pixels/customer events, or attribution settings unless exact current approval covers the action.
Separate repo-known stale evidence from fresh live readback. Do not overclaim purchase currency/value proof without order-level evidence.
Return metric freshness, source, calculations, decision recommendation, and residual uncertainty.
"""
