query NavyCurrentProductSource($id:ID!,$ids:[ID!]!,$after:String){
shop{id myshopifyDomain}
product(id:$id){id handle title status onlineStoreUrl publishedAt descriptionHtml seo{title description} tags productType totalInventory
options{id name values}
variants(first:50,after:$after){nodes{id title sku barcode price compareAtPrice selectedOptions{name value} inventoryPolicy inventoryQuantity sellableOnlineQuantity inventoryItem{id tracked}}pageInfo{hasNextPage endCursor}}
metafields(first:50,after:$after){nodes{id namespace key type value compareDigest}pageInfo{hasNextPage endCursor}}
resourcePublicationsV2(first:50,after:$after){nodes{isPublished publishDate publication{id}}pageInfo{hasNextPage endCursor}}
}
translatableResourcesByIds(resourceIds:$ids,first:10,after:$after){nodes{resourceId translatableContent{key value locale digest}
l_ar:translations(locale:"ar",marketId:null){key value locale outdated}
l_cs:translations(locale:"cs",marketId:null){key value locale outdated}
l_da:translations(locale:"da",marketId:null){key value locale outdated}
