name = "dlm-merchant-feed-worker"
main = "src/automation.js"
compatibility_date = "2026-07-01"
workers_dev = true

# Supply MERCHANT_CONFIG_JSON from a reviewed copy of config.example.json.
# Store SHOPIFY_ADMIN_ACCESS_TOKEN with `wrangler secret put`; never in this file.
# Cron enqueues only. Queue consumers use <=20 new logical Admin operations
# (<=40 external fetches with the one allowed retry) and private R2 checkpoints.
[triggers]
crons = ["0 * * * *"]

[[r2_buckets]]
binding = "MERCHANT_FEED_BUCKET"
bucket_name = "dlm-merchant-feeds"

[[queues.producers]]
binding = "MERCHANT_REFRESH_QUEUE"
queue = "dlm-merchant-feed-refresh"

[[queues.consumers]]
queue = "dlm-merchant-feed-refresh"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 1

[vars]
MERCHANT_CONFIG_JSON = '''{"shopId":"gid://shopify/Shop/15571635","storeDomain":"dresslikemommy-com.myshopify.com","apiVersion":"2026-07","onlinePublicationId":"gid://shopify/Publication/55169925","sourceLocale":"en","maxSnapshotAgeHours":24,"maxFeedAgeHours":48,"refresh":{"maxSourceCallsPerInvocation":20,"maxJobAgeMinutes":120,"minRefreshMinutes":60},"schedules":{"0 * * * *":"us-en"},"returnPolicy":{"exceptionLabel":"no_returns","nativeLabelConfirmed":false,"emitLabels":false,"productTypes":["swimwear","swimsuits","intimates","lingerie"],"taxonomyNames":["Swimwear","Underwear","Lingerie"],"finalSaleTags":["Final Sale","final-sale"]},"markets":[{"key":"us-en","country":"US","locale":"en","currency":"USD","minorUnits":2,"marketId":"gid://shopify/Market/544735329","expectedCatalogs":[{"id":"gid://shopify/MarketCatalog/6881083489","publicationId":"gid://shopify/Publication/77106053217"}],"landingBaseUrl":"https://www.dresslikemommy.com","landingQuery":{},"landingContextVerified":true,"enabled":true},{"key":"au-en","country":"AU","locale":"en","currency":"AUD","minorUnits":2,"marketId":null,"landingBaseUrl":"https://www.dresslikemommy.com","landingQuery":{},"landingContextVerified":false,"enabled":false},{"key":"ca-en","country":"CA","locale":"en","currency":"CAD","minorUnits":2,"marketId":null,"landingBaseUrl":"https://www.dresslikemommy.com","landingQuery":{},"landingContextVerified":false,"enabled":false},{"key":"gb-en","country":"GB","locale":"en","currency":"GBP","minorUnits":2,"marketId":null,"landingBaseUrl":"https://www.dresslikemommy.com","landingQuery":{},"landingContextVerified":false,"enabled":false}]}'''
