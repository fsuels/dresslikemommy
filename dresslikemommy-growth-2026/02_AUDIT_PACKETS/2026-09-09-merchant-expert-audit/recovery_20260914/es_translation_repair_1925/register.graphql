    userErrors { code field message }
  }
  item7: translationsRegister(resourceId: $resource7, translations: $translations7) {
    translations { key locale outdated }
    userErrors { code field message }
  }
  item8: translationsRegister(resourceId: $resource8, translations: $translations8) {
    translations { key locale outdated }
    userErrors { code field message }
  }
  item9: translationsRegister(resourceId: $resource9, translations: $translations9) {
    translations { key locale outdated }
    userErrors { code field message }
  }
}
