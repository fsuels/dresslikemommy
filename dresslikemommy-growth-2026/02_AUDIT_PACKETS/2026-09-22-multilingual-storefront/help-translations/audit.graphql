query HelpPageTranslationAudit($ids: [ID!]!) {
 translatableResourcesByIds(first: 6, resourceIds: $ids) {
  nodes {
   resourceId
   translatableContent { key value locale digest }
   l_ar: translations(locale: "ar") { key value locale outdated }
   l_cs: translations(locale: "cs") { key value locale outdated }
   l_da: translations(locale: "da") { key value locale outdated }
   l_de: translations(locale: "de") { key value locale outdated }
   l_el: translations(locale: "el") { key value locale outdated }
   l_en: translations(locale: "en") { key value locale outdated }
   l_es: translations(locale: "es") { key value locale outdated }
   l_fi: translations(locale: "fi") { key value locale outdated }
   l_fr: translations(locale: "fr") { key value locale outdated }
   l_he: translations(locale: "he") { key value locale outdated }
   l_hi: translations(locale: "hi") { key value locale outdated }
   l_it: translations(locale: "it") { key value locale outdated }
   l_ja: translations(locale: "ja") { key value locale outdated }
   l_ko: translations(locale: "ko") { key value locale outdated }
   l_nl: translations(locale: "nl") { key value locale outdated }
   l_no: translations(locale: "no") { key value locale outdated }
   l_pl: translations(locale: "pl") { key value locale outdated }
   l_pt_BR: translations(locale: "pt-BR") { key value locale outdated }
   l_ro: translations(locale: "ro") { key value locale outdated }
   l_ru: translations(locale: "ru") { key value locale outdated }
   l_sv: translations(locale: "sv") { key value locale outdated }
  }
  pageInfo { hasNextPage endCursor }
 }
}
