query BuyerTruthBefore($current: ID!, $candidate: ID!, $filenames: [String!]!) { current: theme(id:$current) { id name role updatedAt processing processingFailed inventory: files(first:1000) { nodes { filename checksumMd5 size updatedAt } pageInfo { hasNextPage endCursor } } selected: files(first:50,filenames:$filenames) { nodes { filename checksumMd5 size updatedAt body { __typename ... on OnlineStoreThemeFileBodyText { content } } } pageInfo { hasNextPage endCursor } } } candidate: theme(id:$candidate) { id name role updatedAt processing processingFailed inventory: files(first:1000) { nodes { filename checksumMd5 size updatedAt } pageInfo { hasNextPage endCursor } } selected: files(first:50,filenames:$filenames) { nodes { filename checksumMd5 size updatedAt body { __typename ... on OnlineStoreThemeFileBodyText { content } } } pageInfo { hasNextPage endCursor } } } }
