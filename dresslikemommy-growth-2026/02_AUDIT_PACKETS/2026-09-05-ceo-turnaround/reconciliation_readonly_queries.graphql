query DlmReconciliationIdentity { shop { id name primaryDomain { host } currencyCode ianaTimezone } }

query DlmOrderHeaders($after: String, $search: String!) { orders(first: 50, after: $after, query: $search, sortKey: CREATED_AT) { pageInfo { hasNextPage endCursor } nodes { id name createdAt processedAt cancelledAt test displayFinancialStatus displayFulfillmentStatus sourceName taxesIncluded currencyCode presentmentCurrencyCode subtotalPriceSet { shopMoney { amount currencyCode } presentmentMoney { amount currencyCode } } currentSubtotalPriceSet { shopMoney { amount currencyCode } } totalPriceSet { shopMoney { amount currencyCode } presentmentMoney { amount currencyCode } } currentTotalPriceSet { shopMoney { amount currencyCode } } currentTotalTaxSet { shopMoney { amount currencyCode } } currentShippingPriceSet { shopMoney { amount currencyCode } } totalRefundedSet { shopMoney { amount currencyCode } } netPaymentSet { shopMoney { amount currencyCode } } shippingAddress { countryCodeV2 } customerJourneySummary { ready firstVisit { occurredAt source sourceType utmParameters { source medium campaign } } lastVisit { occurredAt source sourceType utmParameters { source medium campaign } } } } } }

query DlmOrderLineEconomics($ids: [ID!]!) { nodes(ids: $ids) { ... on Order { id lineItems(first: 15) { pageInfo { hasNextPage endCursor } nodes { id title quantity currentQuantity product { id handle title status } variant { id } originalTotalSet { shopMoney { amount currencyCode } } discountAllocations { allocatedAmountSet { shopMoney { amount currencyCode } } } } } shippingLines(first: 10) { pageInfo { hasNextPage endCursor } nodes { title originalPriceSet { shopMoney { amount currencyCode } } discountedPriceSet { shopMoney { amount currencyCode } } } } transactions { kind status amountSet { shopMoney { amount currencyCode } } fees { amount { amount currencyCode } taxAmount { amount currencyCode } } } } } }

query DlmVariantCosts($ids: [ID!]!) { nodes(ids:$ids) { ... on ProductVariant { id title price availableForSale product { id title handle status onlineStoreUrl } inventoryItem { unitCost { amount currencyCode } } } } }

query DlmRefundReconciliation($ids: [ID!]!) { nodes(ids: $ids) { ... on Order { id refunds { createdAt totalRefundedSet { shopMoney { amount currencyCode } } refundLineItems(first: 25) { pageInfo { hasNextPage endCursor } nodes { quantity subtotalSet { shopMoney { amount currencyCode } } totalTaxSet { shopMoney { amount currencyCode } } restockType lineItem { id } } } transactions(first: 25) { pageInfo { hasNextPage endCursor } nodes { kind status processedAt amountSet { shopMoney { amount currencyCode } } } } } } } }

query DlmSettledPaymentFees($after: String, $search: String!) { shopifyPaymentsAccount { balanceTransactions(first: 50, after: $after, query: $search, sortKey: PROCESSED_AT, hideTransfers: true) { pageInfo { hasNextPage endCursor } nodes { id transactionDate type sourceType amount { amount currencyCode } fee { amount currencyCode } net { amount currencyCode } associatedOrder { id } } } } }
