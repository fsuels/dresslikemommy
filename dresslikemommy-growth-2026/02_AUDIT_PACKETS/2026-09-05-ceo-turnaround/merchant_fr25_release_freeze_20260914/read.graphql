query MerchantFrenchRepairSources($ids: [ID!]!, $after: String) {
  shop { id myshopifyDomain }
  nodes(ids: $ids) { ... on Product { id status title handle onlineStoreUrl } }
  translatableResourcesByIds(resourceIds: $ids, first: 20, after: $after) {
    nodes {
      resourceId
      translatableContent { key value locale digest }
      translations(locale: "fr", marketId: null) { key value locale outdated }
    }
    pageInfo { hasNextPage endCursor }
  }
}
