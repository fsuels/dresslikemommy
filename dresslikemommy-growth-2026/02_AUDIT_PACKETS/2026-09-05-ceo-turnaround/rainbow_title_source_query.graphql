query RainbowTitleReleaseSource($id: ID!) {
  shop { name currencyCode primaryDomain { host } }
  product(id: $id) { id title handle status descriptionHtml seo { title description } onlineStoreUrl updatedAt }
  translatableResource(resourceId: $id) {
    resourceId
    translatableContent { key value digest locale }
    l0: translations(locale: "ar") { key value outdated }
    l1: translations(locale: "cs") { key value outdated }
    l2: translations(locale: "da") { key value outdated }
    l3: translations(locale: "de") { key value outdated }
    l4: translations(locale: "el") { key value outdated }
    l5: translations(locale: "es") { key value outdated }
    l6: translations(locale: "fi") { key value outdated }
    l7: translations(locale: "fr") { key value outdated }
    l8: translations(locale: "he") { key value outdated }
    l9: translations(locale: "hi") { key value outdated }
    l10: translations(locale: "it") { key value outdated }
    l11: translations(locale: "ja") { key value outdated }
    l12: translations(locale: "ko") { key value outdated }
    l13: translations(locale: "nl") { key value outdated }
    l14: translations(locale: "no") { key value outdated }
    l15: translations(locale: "pl") { key value outdated }
    l16: translations(locale: "pt-BR") { key value outdated }
    l17: translations(locale: "ro") { key value outdated }
    l18: translations(locale: "ru") { key value outdated }
    l19: translations(locale: "sv") { key value outdated }
  }
}
