query RecentOrderTransactionJoin($filter: String!) {
 orders(first:50,query:$filter) { nodes { createdAt currentTotalPriceSet { shopMoney { amount currencyCode } presentmentMoney { amount currencyCode } } transactions { id kind status test gateway amountSet { shopMoney { amount currencyCode } presentmentMoney { amount currencyCode } } fees { type amount { amount currencyCode } taxAmount { amount currencyCode } } } } pageInfo { hasNextPage endCursor } }
}
