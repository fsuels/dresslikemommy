query DlmCartThemeManifests($mainId:ID!,$draftId:ID!,$mainAfter:String,$draftAfter:String){main:theme(id:$mainId){id role files(first:250,after:$mainAfter){nodes{filename checksumMd5}pageInfo{hasNextPage endCursor}userErrors{code filename}}}draft:theme(id:$draftId){id role files(first:250,after:$draftAfter){nodes{filename checksumMd5}pageInfo{hasNextPage endCursor}userErrors{code filename}}}}
