query DlmCartDraftPreflight($draftId:ID!){shop{id primaryDomain{url}} main:themes(first:1,roles:[MAIN]){nodes{...CartTheme}pageInfo{hasNextPage endCursor}} draft:theme(id:$draftId){...CartTheme}}
fragment CartTheme on OnlineStoreTheme{id name role processing processingFailed cart:files(first:1,filenames:["assets/cart.js"]){nodes{filename checksumMd5 body{... on OnlineStoreThemeFileBodyText{content}}}pageInfo{hasNextPage endCursor}userErrors{code filename}} seo:files(first:2,filenames:["locales/da.json","locales/nl.json"]){nodes{filename checksumMd5}pageInfo{hasNextPage endCursor}userErrors{code filename}}}
