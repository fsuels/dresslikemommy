name: Nightly Merchant Center feed validation

on:
  schedule:
    # 06:00 UTC = 02:00 ET — runs before MC's typical morning fetch window.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail the run if any item has errors'
        type: boolean
        default: false
      skip_url_check:
        description: 'Skip HTTP probes (validate required fields only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      SHOPIFY_PUBLIC_DOMAIN: ${{ vars.SHOPIFY_PUBLIC_DOMAIN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/validateFeed/package.json

      - name: Install validator deps
        working-directory: scripts/validateFeed
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Pull latest Shopify product export
        id: pull_feed
        run: |
          set -euo pipefail
          if [ -z "${SHOPIFY_STORE_DOMAIN:-}" ] || [ -z "${SHOPIFY_ADMIN_TOKEN:-}" ]; then
            echo "::warning ::SHOPIFY_STORE_DOMAIN or SHOPIFY_ADMIN_TOKEN not set — falling back to repo fixture tmp_products.json"
            echo "input_path=tmp_products.json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .tmp
          # Page through Admin REST products.json. 250 per page is the API max.
          page_url="https://${SHOPIFY_STORE_DOMAIN}/admin/api/2024-07/products.json?limit=250"
          : > .tmp/products.ndjson
          while [ -n "$page_url" ]; do
            resp_headers=$(mktemp)
            body=$(curl -sS -D "$resp_headers" \
              -H "X-Shopify-Access-Token: ${SHOPIFY_ADMIN_TOKEN}" \
              -H "Accept: application/json" \
              "$page_url")
            echo "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);for(const p of j.products||[])console.log(JSON.stringify(p));});" \
              >> .tmp/products.ndjson
            link=$(grep -i '^link:' "$resp_headers" || true)
            rm -f "$resp_headers"
            page_url=$(printf '%s' "$link" | sed -nE 's/.*<([^>]+)>; rel="next".*/\1/p')
          done
          # Wrap NDJSON into the {products:[...]} shape the validator expects.
          node -e "const fs=require('fs');const lines=fs.readFileSync('.tmp/products.ndjson','utf8').trim().split('\n').filter(Boolean);fs.writeFileSync('.tmp/products.json',JSON.stringify({products:lines.map(l=>JSON.parse(l))}));"
          echo "input_path=.tmp/products.json" >> "$GITHUB_OUTPUT"

      - name: Run validator
        id: run
        working-directory: scripts/validateFeed
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ inputs.strict }}" = "true" ]; then extra+=(--strict); fi
          if [ "${{ inputs.skip_url_check }}" = "true" ]; then extra+=(--skip-url-check); fi
          node validateFeed.js \
            --input "../../${{ steps.pull_feed.outputs.input_path }}" \
            --out ./reports \
            --store-domain "${SHOPIFY_PUBLIC_DOMAIN:-dresslikemommy.com}" \
            "${extra[@]}" | tee reports/run.log
          # Hoist a few summary fields into step outputs for downstream steps.
          node -e "const s=require('./reports/summary.json');console.log('total_errors='+s.total_errors);console.log('items='+s.items);" >> "$GITHUB_OUTPUT"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-validation-${{ github.run_id }}
          path: scripts/validateFeed/reports/
          retention-days: 30

      - name: Notify Slack on errors
        if: ${{ env.SLACK_WEBHOOK_URL != '' && steps.run.outputs.total_errors != '0' }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(node -e "const s=require('./scripts/validateFeed/reports/summary.json');const lines=Object.entries(s.buckets).map(([k,v])=>\`• \${k}: \${v.errors} errors / \${v.valid} valid\`).join('\\n');process.stdout.write(JSON.stringify({text:\`*Merchant Center feed validation* — \${s.total_errors} errors across \${s.items} items\\n\${lines}\\n<\${process.env.RUN_URL}|View run>\`}));" RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")" \
            "$SLACK_WEBHOOK_URL"
